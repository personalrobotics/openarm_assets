#
# The OpenArm, both arms, as one gafro-robot-node, in simulation. Each arm is commanded on its own and both together by the same
# controller: `follow_paths` tracks a joint path per arm, and an arm that is sent nothing holds where its last path ended (its input
# starts at the posture the node started in).
#
#   right alone:  a path on `right/path/trajectory` (and its rates on `right/path_rate/trajectory`), then the behaviour `track_right`
#   left alone:   the same on `left/...`, then `track_left`
#   together:     a path on each, then `track_both` (both start, run and arrive under the same checks)
#   hold:         the behaviour `follow_paths` (the plain controller): both arms hold their last path's end
#
# There is one controller on purpose. The node runs one at a time, and every controller has its own inputs, each starting at the
# posture the node started in: a second controller for an arm (a go-to-position, say) would, when switched to, send the other arm
# back to that posture. A move from where an arm is to a goal is a path that starts at the arm's posture (a planner's, or `reach`).
#
#   gafro-robot-node --config src/openarm_assets/configs/node.yaml --transport local --run-for 10
#
# Installed, it is the package's: a robot's config says `extends: openarm_assets:configs/node.yaml`.
#
# The robot's own variants extend this file: the hardware backend, the driver's permit as a guard, and a transport.
robot:
  model: ../models/openarm/generated/openarm_bimanual_decorated.xml   # beside this file, in the checkout and in the installed package
  backend: sim
  task_space: bimanual          # the model's two-arm task space: the controller's

task_spaces:
  right: {pose: right/pose}
  left: {pose: left/pose}

inputs:                         # each input's task space is the stage's that reads it
  posture_right: {channel: right/path}
  posture_rate_right: {channel: right/path_rate}
  posture_left: {channel: left/path}
  posture_rate_left: {channel: left/path_rate}

controllers:
  follow_paths:                 # joint-position control of both arms: each tracks its own joint path (posture), driven by position
    inputs: {posture_right: joints, posture_rate_right: joint_rates, posture_left: joints, posture_rate_left: joint_rates}
    type: position
    maximum_lead: 0.02          # rad per joint: the offset that closes what the actuator did not do (friction dead band)
    maximum_error: 0.15         # rad per joint: the leash of the anchor on the measured position
    offset_gain: 2.0            # 1/s: low, a high gain hunts against friction
    regularization: 0.05
    limits: {joint_velocity: model}
    stages:
      - name: posture_right
        task_space: right
        input: joints
        objective: {posture: {target: posture_right}}
        law: {pd: {gain: 20.0, feedforward: posture_rate_right}}
        output: velocity
      - name: posture_left
        task_space: left
        input: joints
        objective: {posture: {target: posture_left}}
        law: {pd: {gain: 20.0, feedforward: posture_rate_left}}
        output: velocity

behaviours:
  track_right:
    template: track_trajectory          # gafro-robot-node ships it
    with: {controller: follow_paths, input: posture_right}

  track_left:
    template: track_trajectory
    with: {controller: follow_paths, input: posture_left}

  track_both:                   # both arms' paths together, under the same checks
    template: track_trajectory
    with: {controller: follow_paths, input: [posture_right, posture_left]}

start: follow_paths
knots: {posture_right: 400, posture_left: 400}   # the most knots one path may carry; each rate input takes its path's

loop: {period: 0.004, health_period: 0.5}

transport:
  name: local
  channels: {lifecycle: lifecycle, health: health, behaviour: behaviour}
