[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "openarm_assets"
version = "0.1.0"
description = "MuJoCo models for the OpenArm robot"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Eric Goossen", email = "ericjgoossen@gmail.com"},
]
maintainers = [
    {name = "Eric Goossen", email = "ericjgoossen@gmail.com"},
]
dependencies = [
    "mujoco",
    "numpy-stl>=3.2.0",
]



[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
openarm_assets = [
    "models/**/*.xml",
    # build_openarm reads the URDF's rated torque and speed limits (urdf_limits), so a package without it cannot build a model.
    "models/**/*.urdf",
    "models/**/*.stl",
    "models/**/*.obj",
    "models/**/*.png",
    "models/**/*.mtl",
    "models/**/README.md",
    "models/**/LICENSE",
]


[project.urls]
Homepage = "https://github.com/personalrobotics/openarm_assets"
Repository = "https://github.com/personalrobotics/openarm_assets"
Issues = "https://github.com/personalrobotics/openarm_assets/issues"


[tool.ruff]
line-length = 120


[tool.ruff.lint]
select = ["F", "E", "W", "I"]


[tool.ruff.lint.per-file-ignores]
"src/openarm_assets/__init__.py" = ["F401"]


[dependency-groups]
dev = [
    "pillow>=12.1.0",
    "pytest",
    "ruff",
]
