#
# node.yaml with the `reach` behaviour: a pose goes in on `right/reach/target`, the plugin plans the hand to it (gafro's iLQR, seeded with a posture
# on the pose's self-motion charts) and publishes the path on `goal`, and go_to_position follows it. `reach_failed` counts the poses that no path reached.
# The plugin is libgafro_self_motion_charts_reach_task_nodes.so (lab/self-motion-charts, cpp/task_nodes): put its directory on GAFRO_PLUGIN_PATH.
#
#   gafro-robot-node --config configs/node_reach.yaml --transport local --run-for 10
#
# `charts` is what ssik derives for the arm, in Python (python cpp/task_nodes/srs_constants.py MODEL right, in self-motion-charts); it follows the model.
extends: node.yaml

task_nodes: [{name: self_motion_charts_reach}]

events: [reach_failed]

inputs:
  reach: {task_space: right, channel: right/reach}

controllers:
  hold_pose:                    # declares the pose input `reach` reads; also holds the hand at a pose, by position
    inputs: {reach: pose}
    type: position
    maximum_lead: 0.02
    maximum_error: 0.15
    offset_gain: 2.0
    regularization: 0.05
    limits: {joint_velocity: model}
    stages:
      - name: pose
        task_space: right
        input: pose
        objective: {pose: {target: reach}}
        law: {pd: {gain: 5.0, max_speed: {linear: 0.2, angular: 0.8}}}
        output: velocity

behaviours:
  reach_pose:
    sequence:
      - reach:
          target: reach
          to: goal
          task_space: right
          knots: 40
          horizon: 4.0
          failed: reach_failed
          charts: {joints: [openarm_right_joint1, openarm_right_joint2, openarm_right_joint3, openarm_right_joint4, openarm_right_joint5, openarm_right_joint6, openarm_right_joint7], srs: {ee_offset_local: [9.999999999975306e-07, -0.004500000000000021, 0.18010000000000004], elbow_index: 3, forearm_home: [0.0, 0.031500916410469315, -0.21599986635482127], general_path: true, l_ew: 0.2182847910414283, l_se: 0.22224367257584637, r_post_wrist: [1.0, 0.0, 0.0, 0.0, -0.9999999999910005, 4.242642374076458e-06, 0.0, -4.242642374076458e-06, -0.9999999999910005], shoulder_pivot: [0.0, -0.15349999999889752, 0.6979994802763092], upper_home: [3.469446951953614e-18, -0.03149906661839416, -0.2200001336412548]}}
      - timeout:
          seconds: 12
          child:
            fallback:
              - near_trajectory: {input: goal, tolerance: 0.02, at: end}
              - action: go_to_position

knots: {goal: 41, reach: 2}
