#
# node.yaml on the arm: the hardware backend, the permit guard, and ROS 2 as the transport.
#
#   gafro-robot-node --config configs/node_hardware.yaml \
#     --set robot.hardware_config=/etc/opendubs/hardware.yaml --set robot.model=<the robot's model, with its head cap>
#
# Two things are the robot's, not this repository's, and are given at deploy time: the hardware config (opendubs'
# software/openarm/gafro/hardware.example.yaml is its template: one `openarm` driver per control group, `left_arm` and `right_arm`, each with
# `require_permit: true`) and the model the robot runs (this repository's, plus the head cap that limits joint 2).
#
# The guard is per robot: while the deadman is held every arm of it may move, while it is not every arm holds. `groups` are the drivers' names
# in the hardware config, which is what their permits go by. Its gate state is the dashboard's `/opendubs/motion_gate`, a
# diagnostic_msgs/DiagnosticArray, which the ROS 2 transport hands the guard as a Health on the channel `motion_gate`.
extends: node.yaml

robot:
  backend: hardware

guard:
  name: opendubs_permit               # libgafro_opendubs_permit_guard.so, from gafro-opendubs-nodes
  groups: [left_arm, right_arm]
  gate: motion_gate
  component: motion_gate
  lease: 0.5                          # s: the most the arms keep moving after the gate closes
  period: 0.1                         # s: how often the gate is asked and the permit renewed
  max_age: 0.25                       # s: a state older than this counts as no state

transport:
  name: ros2
  topics: {motion_gate: /opendubs/motion_gate}
